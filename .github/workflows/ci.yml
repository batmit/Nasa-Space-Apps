name: CI

on:
  push:
    branches: [back-end]
  pull_request:
    branches: [main, back-end]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check backend syntax and imports
        run: |
          python -m compileall -q src/backend
          python -c "from src.backend.main import app"
      - name: Run tests
        run: |
          status=0
          python -m pytest test/ -q || status=$?
          if [ "$status" -eq 5 ]; then
            echo "::notice::No tests collected in test/ yet."
          else
            exit "$status"
          fi
